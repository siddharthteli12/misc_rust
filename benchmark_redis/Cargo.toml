[package]
name = "benchmark_redis"
version = "0.1.0"
edition = "2024"


[dependencies]
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = { version = "0.22.0", features = ["rt_tokio_1"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rand = "0.8"


[dev-dependencies]
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }

[[bench]]
name = "redis_bench"
harness = false
